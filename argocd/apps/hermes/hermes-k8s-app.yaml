# Hermes on Kubernetes (replaces the KubeVirt VM in ns agents).
# Chart: unofficial ultraworkers chart, pinned commit, direct mode.
# Values + extra manifests: hermes-config repo (private), branch main.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hermes-k8s
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: hermes
  sources:
    - repoURL: https://github.com/ultraworkers/hermes-agent-helm-chart.git
      # Keep in lockstep with CHART_REF in hermes-config jenkins/Jenkinsfile
      targetRevision: e3b685d4d0288668a37216435742cd0a659ebc6c
      path: .
      helm:
        releaseName: hermes          # selector label instance=hermes (services.yaml depends on it)
        skipCrds: true               # chart ships a HermesTenant CRD, not needed in direct mode
        # Order = Helm merge order. Keep in lockstep with VALUES in hermes-config jenkins/Jenkinsfile.
        valueFiles:
          - $cfg/deploy/values.yaml          # infra: images, sidecars, probes, netpol
          - $cfg/deploy/values-config.yaml   # config.raw   -> kw-config/config.yaml
          - $cfg/deploy/values-soul.yaml     # soul.text    -> kw-config/SOUL.md
          - $cfg/deploy/values-files.yaml    # extraObjects -> kw-files (AGENTS.md, qmd index, stignore)
    - repoURL: https://github.com/anymus0/hermes-config.git
      targetRevision: main
      ref: cfg
    - repoURL: https://github.com/anymus0/hermes-config.git
      targetRevision: main
      path: deploy/manifests
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true