# Cluster-wide. Apply BEFORE the GCP node joins.
# Goal: flannel picks the physical NIC on LAN servers and tailscale0 on the GCP
# node (whose ens4 must NOT match). flannel walks interfaces in kernel index
# order and takes the first regex match; the physical NIC always has a lower
# index than tailscale0, so LAN servers keep their current interface.
#
# Replace enp1s0 with the real LAN NIC name(s) from `ip -o link` on rke01/rke02.
# If you already manage a rke2-canal HelmChartConfig (ArgoCD or
# /var/lib/rancher/rke2/server/manifests), merge into it instead.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: rke2-canal
  namespace: kube-system
spec:
  valuesContent: |-
    flannel:
      iface: ""
      regexIface: "^(enp1s0|tailscale0)$"
