apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
spec:
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  project: default
  sources:
    - chart: longhorn
      repoURL: https://charts.longhorn.io/
      targetRevision: 1.1.0
      helm:
        releaseName: longhorn
        valuesObject:
          global:
            nodeSelector:
              longhorn.io/storage-node: "true"
          longhornManager:
            nodeSelector:
              longhorn.io/storage-node: "true"
          longhornDriver:
            nodeSelector:
              longhorn.io/storage-node: "true"
          longhornUI:
            nodeSelector:
              longhorn.io/storage-node: "true"
          persistence:
            defaultClassReplicaCount: 2
          defaultSettings:
            defaultReplicaCount: '{"v1":"2","v2":"2"}'
            systemManagedComponentsNodeSelector: "longhorn.io/storage-node:true"
            nodeDrainPolicy: "block-for-eviction-if-contains-last-replica"
            # fence pods on dead node, frees RWO attachment
            nodeDownPodDeletionPolicy: "delete-both-statefulset-and-deployment-pod"
            # heal detached degraded volumes
            offlineReplicaRebuilding: "true"
            # move replicas back onto rke03 after it returns
            replicaAutoBalance: "best-effort"
            # tolerate short laptop stalls (range 8..30s), cost: longer I/O freeze on real failure
            engineReplicaTimeout: "15"
          metrics:
            serviceMonitor:
              enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system