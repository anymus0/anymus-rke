apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  namespace: crawl
  labels: { app: searxng }
spec:
  replicas: 2
  selector: { matchLabels: { app: searxng } }
  template:
    metadata:
      labels: { app: searxng }
      annotations:
        # ConfigMap/Secret changes do not roll the pod. Bump by hand when
        # searxng-cm.yaml or searxng-auth changes.
        crawl/settings-rev: "2"
    spec:
      enableServiceLinks: false
      initContainers:
        - name: render-settings
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              set -eu
              # fail loud on missing keys instead of rendering a broken settings.yml
              : "${SEARXNG_SECRET:?missing}" "${BRAVE_API_KEY:?missing}"
              # values must not contain | or & (sed delimiter / replacement token)
              sed -e "s|__SEARXNG_SECRET__|${SEARXNG_SECRET}|" \
                  -e "s|__BRAVE_API_KEY__|${BRAVE_API_KEY}|" \
                  /tmp/cm/settings.yml > /etc/searxng/settings.yml
              ! grep -q '__[A-Z_]*__' /etc/searxng/settings.yml
          env:
            - name: SEARXNG_SECRET
              valueFrom:
                secretKeyRef: { name: searxng-auth, key: SEARXNG_SECRET }
            - name: BRAVE_API_KEY
              valueFrom:
                secretKeyRef: { name: searxng-auth, key: BRAVE_API_KEY }
          volumeMounts:
            - { name: settings-src, mountPath: /tmp/cm, readOnly: true }
            - { name: settings-rendered, mountPath: /etc/searxng }
      containers:
        - name: searxng
          image: searxng/searxng:2026.10.19-81371861f
          ports: [{ containerPort: 8080 }]
          env:
            - name: SEARXNG_BASE_URL
              value: "https://searxng.icefish-pickerel.ts.net/"
          volumeMounts:
            - name: settings-rendered
              mountPath: /etc/searxng
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 512Mi }
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 10
          livenessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 20
      volumes:
        - name: settings-src
          configMap: { name: searxng-settings }
        - name: settings-rendered
          emptyDir: {}
