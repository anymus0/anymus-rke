apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng-settings
  namespace: crawl
data:
  settings.yml: |
    use_default_settings:
      engines:
        keep_only:
          - braveapi
          - bing
          - yahoo
          - google cse
          - startpage
          - mojeek
          - wikipedia
    general:
      instance_name: "hermes-searxng"
      debug: false
    server:
      bind_address: "0.0.0.0"
      port: 8080
      secret_key: "__SEARXNG_SECRET__"    # placeholder, substituted at runtime
      limiter: false
      public_instance: false
      image_proxy: false
    outgoing:
      request_timeout: 4.0       # default 2.0, too tight
      max_request_timeout: 8.0
    search:
      safe_search: 0
      formats:
        - html
        - json
    ui:
      static_use_hash: true
    engines:
      # not enabled by default upstream, enable explicitly
      - name: bing
        disabled: false
      - name: yahoo
        disabled: false
      - name: startpage
        disabled: false
      - name: mojeek
        disabled: false
      # Brave Search API (paid, ~1000 req/month covered by free credit).
      # Scraper engine "brave" intentionally not in keep_only.
      - name: braveapi
        engine: braveapi
        shortcut: bra
        api_key: "__BRAVE_API_KEY__"   # substituted at runtime from searxng-auth
        results_per_page: 20
        inactive: false                # API-key engines default to inactive: true
        disabled: false
