apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jenkins
  namespace: argocd
spec:
  project: default
  destination:
    server: "https://kubernetes.default.svc"
    namespace: jenkins
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  source:
    path: charts/jenkins
    repoURL: https://github.com/jenkinsci/helm-charts.git
    targetRevision: bcddfb71addaf3c0cd865fc7491fbc1df2c7c9f1
    helm:
      releaseName: jenkins
      valuesObject:
        controller:
          # -------------------------------------------------------
          # URL & protocol
          # -------------------------------------------------------
          jenkinsUrlProtocol: https
          jenkinsUrl: "https://ci.icefish-pickerel.ts.net"

          # -------------------------------------------------------
          # Use YOUR secret for admin — chart will not generate one
          # -------------------------------------------------------
          admin:
            existingSecret: "jenkins-admin-secret"
            userKey: jenkins-admin-user
            passwordKey: jenkins-admin-password

          # -------------------------------------------------------
          # Don't reinitialize plugins/config on every pod restart
          # -------------------------------------------------------
          initializeOnce: true

          # -------------------------------------------------------
          # Plugins — add dark-theme, job-dsl, github-branch-source
          # on top of the defaults
          # -------------------------------------------------------
          installPlugins:
            - kubernetes:latest
            - workflow-aggregator:latest
            - git:latest
            - configuration-as-code:latest
            - dark-theme:latest
            - job-dsl:latest
            - github-branch-source:latest

          # -------------------------------------------------------
          # Mount GitHub secret so JCasC can interpolate it.
          # Convention: ${<secret-name>-<keyName>}
          # → ${openclaw-config-github-jenkins-creds-username}
          # → ${openclaw-config-github-jenkins-creds-password}
          # -------------------------------------------------------
          additionalExistingSecrets:
            - name: openclaw-config-github-jenkins-creds
              keyName: username
            - name: openclaw-config-github-jenkins-creds
              keyName: password
            - name: hermes-config-github-jenkins-creds
              keyName: username
            - name: hermes-config-github-jenkins-creds
              keyName: password
            # hermes harbor
            - name: harbor-hermes-robot
              keyName: username
            - name: harbor-hermes-robot
              keyName: password
            # ── Hermes pipeline runtime secrets ──
            - name: hermes-jenkins-creds
              keyName: herm-ssh-key
            - name: hermes-jenkins-creds
              keyName: api-server-key
            - name: hermes-jenkins-creds
              keyName: llm-api-key
            - name: hermes-jenkins-creds
              keyName: firecrawl-api-key
            - name: hermes-jenkins-creds
              keyName: litellm-virtual-key
            - name: hermes-jenkins-creds
              keyName: dashboard-pw-hash
            - name: hermes-jenkins-creds
              keyName: dashboard-secret

          ingress:
            enabled: false

          JCasC:
            defaultConfig: true
            overwriteConfiguration: true

            securityRealm: |-
              local:
                allowsSignup: false
                enableCaptcha: false
                users:
                  - id: "${chart-admin-username}"
                    name: "Jenkins Admin"
                    password: "${chart-admin-password}"

            authorizationStrategy: |-
              loggedInUsersCanDoAnything:
                allowAnonymousRead: false

            configScripts:

              # -------------------------------------------------------
              # Dark theme — forces dark for all users
              # Use theme: "darkSystem" to respect OS preference instead
              # -------------------------------------------------------
              appearance: |
                appearance:
                  themeManager:
                    disableUserThemes: true
                    theme: "dark"

              # -------------------------------------------------------
              # GitHub credentials for private repo
              # -------------------------------------------------------
              credentials: |
                credentials:
                  system:
                    domainCredentials:
                      - credentials:
                          - usernamePassword:
                              id: "openclaw-config-github-jenkins-creds"
                              description: "GitHub credentials for private repo"
                              scope: GLOBAL
                              username: "${openclaw-config-github-jenkins-creds-username}"
                              password: "${openclaw-config-github-jenkins-creds-password}"
                          - usernamePassword:
                              id: "hermes-config-github-jenkins-creds"
                              description: "GitHub credentials for private repo"
                              scope: GLOBAL
                              username: "${hermes-config-github-jenkins-creds-username}"
                              password: "${hermes-config-github-jenkins-creds-password}"

                          - usernamePassword:
                              id: "harbor-robot-hermes"
                              description: "Harbor robot (hermes project, push+pull)"
                              scope: GLOBAL
                              username: "${harbor-hermes-robot-username}"
                              password: "${harbor-hermes-robot-password}"

                          # ── Hermes VM SSH ──
                          - basicSSHUserPrivateKey:
                              id: "HERMES_HERM_SSH"
                              description: "SSH key for herm@hermes VM"
                              scope: GLOBAL
                              username: "herm"
                              privateKeySource:
                                directEntry:
                                  privateKey: "${hermes-jenkins-creds-herm-ssh-key}"

                          # ── Hermes runtime secrets ──
                          - string:
                              id: "HERMES_API_SERVER_KEY"
                              description: "Hermes API server bearer key"
                              scope: GLOBAL
                              secret: "${hermes-jenkins-creds-api-server-key}"
                          - string:
                              id: "HERMES_LLM_API_KEY"
                              description: "OPENAI_API_KEY for local LM Studio endpoint"
                              scope: GLOBAL
                              secret: "${hermes-jenkins-creds-llm-api-key}"
                          - string:
                              id: "HERMES_FIRECRAWL_API_KEY"
                              description: "crw / Firecrawl-compatible API key"
                              scope: GLOBAL
                              secret: "${hermes-jenkins-creds-firecrawl-api-key}"
                          - string:
                              id: "HERMES_LITELLM_VIRTUAL_KEY"
                              description: "LiteLLM scoped virtual key for Hermes"
                              scope: GLOBAL
                              secret: "${hermes-jenkins-creds-litellm-virtual-key}"
                          - string:
                              id: "HERMES_DASHBOARD_PW_HASH"
                              description: "Hermes dashboard basic-auth bcrypt hash"
                              scope: GLOBAL
                              secret: "${hermes-jenkins-creds-dashboard-pw-hash}"
                          - string:
                              id: "HERMES_DASHBOARD_SECRET"
                              description: "Hermes dashboard basic-auth session secret"
                              scope: GLOBAL
                              secret: "${hermes-jenkins-creds-dashboard-secret}"

              # -------------------------------------------------------
              # OPENCLAW-DEPLOY multibranch pipeline job
              # -------------------------------------------------------
              jobs: |
                jobs:
                  - script: |
                      pipelineJob('OPENCLAW-DEPLOY') {
                        definition {
                          cpsScm {
                            scm {
                              git {
                                remote {
                                  url('https://github.com/anymus0/openclaw-config.git')
                                  credentials('openclaw-config-github-jenkins-creds')
                                }
                                branches('*/main')
                              }
                            }
                            scriptPath('jenkins/Jenkinsfile')
                            lightweight(true)
                          }
                        }
                        triggers {
                          githubPush()
                        }
                      }
                  - script: |
                      pipelineJob('HERMES-DEPLOY') {
                        definition {
                          cpsScm {
                            scm {
                              git {
                                remote {
                                  url('https://github.com/anymus0/hermes-config.git')
                                  credentials('hermes-config-github-jenkins-creds')
                                }
                                branches('*/main')
                              }
                            }
                            scriptPath('jenkins/Jenkinsfile')
                            lightweight(true)
                          }
                        }
                        triggers {
                          githubPush()
                        }
                      }
                  - script: |
                      pipelineJob('HERMES-CI') {
                        definition {
                          cpsScm {
                            scm {
                              git {
                                remote {
                                  url('https://github.com/anymus0/hermes-config.git')
                                  credentials('hermes-config-github-jenkins-creds')
                                }
                                branches('*/k8s')
                              }
                            }
                            scriptPath('jenkins/Jenkinsfile')
                            lightweight(true)
                          }
                        }
                        triggers {
                          githubPush()
                        }
                      }

        # -------------------------------------------------------
        # Agent: switch to WebSocket, drop the JNLP tunnel
        # defaultConfig: true generates the k8s cloud JCasC from
        # these values — do NOT also define the cloud in configScripts
        # or you'll get a duplicate cloud error
        # -------------------------------------------------------
        agent:
          websocket: true
          jenkinsUrl: "http://jenkins.jenkins:8080"
          jenkinsTunnel: ""
          directConnection: false
