apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: immich
  namespace: argocd
spec:
  project: default
  destination:
    server: "https://kubernetes.default.svc"
    namespace: cloud
  source:
    repoURL: https://github.com/immich-app/immich-charts.git
    targetRevision: 574bafe27c21d5314f8b5256933595e5d3c0494c
    path: charts/immich
    helm:
      releaseName: immich
      valuesObject:
        controllers:
          main:
            containers:
              main:
                image:
                  tag: v3.3.5
                env:
                  DB_HOSTNAME:
                    valueFrom:
                      secretKeyRef:
                        name: immich-postgresql-creds
                        key: host
                  DB_USERNAME:
                    valueFrom:
                      secretKeyRef:
                        name: immich-postgresql-creds
                        key: username
                  DB_PASSWORD:
                    valueFrom:
                      secretKeyRef:
                        name: immich-postgresql-creds
                        key: password
                  DB_DATABASE_NAME:
                    valueFrom:
                      secretKeyRef:
                        name: immich-postgresql-creds
                        key: dbname
        immich:
          metrics:
            enabled: true
          persistence:
            library:
              existingClaim: immich-default-vol
        server:
          ingress:
            main:
              enabled: false
        machine-learning:
          persistence:
            cache:
              enabled: true
              type: persistentVolumeClaim
              size: 20Gi
              accessMode: ReadWriteMany
              storageClass: longhorn
        valkey:
          enabled: true
          persistence:
            data:
              enabled: true
              type: persistentVolumeClaim
              size: 1Gi
              accessMode: ReadWriteOnce
              storageClass: longhorn
