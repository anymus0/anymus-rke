# Mem0 dashboard (browser UI).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mem0-ingress
  namespace: mem0
  annotations:
    argocd.argoproj.io/sync-wave: "20"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    tailscale.com/proxy-group: ingress-proxies
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: mem0-dashboard
      port:
        number: 3000
  tls:
    - hosts:
        - mem0
---
# Mem0 API. Needed because the dashboard JS in the browser calls the API
# directly (NEXT_PUBLIC_API_URL), so the API needs its own tailnet hostname.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mem0-api-ingress
  namespace: mem0
  annotations:
    argocd.argoproj.io/sync-wave: "20"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    tailscale.com/proxy-group: ingress-proxies
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: mem0-server
      port:
        number: 8000
  tls:
    - hosts:
        - mem0-api
